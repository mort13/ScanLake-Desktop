[project]
name = "scanlake-inference"
version = "0.1.0"
description = "Batched CNN inference backends for ScanLake: ONNX Runtime (DirectML/CPU) and PyTorch"
requires-python = ">=3.13"
dependencies = [
    "scanlake-core",
    "numpy>=2.1",
    # DirectML runs on any DX12 GPU (AMD, NVIDIA, Intel) and includes the CPU provider.
    # Never add onnxruntime-gpu: it installs the same module and conflicts.
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
]

[project.optional-dependencies]
torch = ["scanlake-models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanlake_inference"]
