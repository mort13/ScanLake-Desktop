[project]
name = "scanlake-core"
version = "0.1.0"
description = "ScanLake HUD recognition core: format, profiles, vision, preprocessing, decoding, voting"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanlake_core"]
