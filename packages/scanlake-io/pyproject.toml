[project]
name = "scanlake-io"
version = "0.1.0"
description = "ScanLake data I/O: format-driven Parquet writer, Store and Gateway clients, assets"
requires-python = ">=3.13"
dependencies = [
    "scanlake-core",
    "pyarrow>=18",
    "httpx>=0.28",
]

[project.scripts]
scanlake-data = "scanlake_io.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanlake_io"]
